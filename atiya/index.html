<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atiya Concept — Mode féminine à Bamako</title>
<meta name="description" content="Atiya Concept, mode féminine à Bamako : robes, ensembles, hauts, jupes et pantalons. Paiement à la livraison.">
<meta name="theme-color" content="#d0406e">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="accueil">
<main>
  <!-- Bannière : pour mettre ta propre bannière (faite sur Canva par ex.), ajoute images/banniere.jpg -->
  <section class="hero">
    <img class="hero-banniere" src="images/banniere.jpg" alt="Atiya Concept — Bienvenue" onload="this.parentNode.classList.add('a-banniere')" onerror="this.remove()">
    <span class="deco d1">🎀</span><span class="deco d2">🌸</span><span class="deco d3">🌸</span><span class="deco d4">🎀</span>
    <div class="hero-contenu">
      <p class="hero-marque">Atiya<small>CONCEPT</small></p>
      <h1>Bienvenue</h1>
      <p class="hero-script">chez Atiya</p>
      <p class="hero-sep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-4.9-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 6.1-8 11-8 11z"/></svg></p>
      <p class="hero-accroche">La mode qui te ressemble,<br>l'élégance qui te sublime.</p>
      <a class="hero-pilule" href="boutique.html"><span>✦</span> Sois belle, sois toi <span>✦</span></a>
      <div class="hero-photos">
        <div class="arche ph"><img src="images/accueil-1.jpg" alt="" onerror="this.remove()"></div>
        <div class="arche milieu ph"><img src="images/accueil-2.jpg" alt="" onerror="this.remove()"></div>
        <div class="arche ph"><img src="images/accueil-3.jpg" alt="" onerror="this.remove()"></div>
      </div>
    </div>
  </section>

  <section class="bande" aria-label="Nos engagements">
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/></svg><span>Pièces<br>sélectionnées</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2 2V10l-8.5 5.6a1.2 1.2 0 0 0 .7 2.2h15.6a1.2 1.2 0 0 0 .7-2.2L12 10"/></svg><span>Nouveautés<br>chaque semaine</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg><span>Qualité<br>premium</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v10h-11zM13.5 10h4l3 3.2v3.3h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span>Livraison<br>à Bamako</span></div>
    <div><span class="script">Rayonne.</span></div>
  </section>

  <section class="valeurs" aria-hidden="true">
    <span class="v1">CHIC</span><span class="v2">GLAM</span><span class="v3">belle</span><span class="v4">STYLE</span>
  </section>

  <section class="section-rose">
    <h2 class="titre">Nos Nouveautés</h2>
    <div class="carrousel" id="nouveautes"></div>
    <p class="voir-tout"><a class="btn-noir" href="boutique.html">VOIR TOUT</a></p>

    <div class="collections" id="collections"></div>

    <div class="panneau">
      <div class="panneau-grille">
        <!-- Photo : ajoute images/questions.jpg -->
        <div class="panneau-img ph"><img src="images/questions.jpg" alt="" onerror="this.remove()"></div>
        <div>
          <h2 class="titre faq-titre">Questions Fréquentes&nbsp;!?</h2>
          <div class="faq" id="faq"></div>
        </div>
      </div>
    </div>
    <div class="garanties" id="garanties"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
