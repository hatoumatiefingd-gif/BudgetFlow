<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Atiya Concept</title>
<meta name="description" content="Contactez Atiya Concept sur WhatsApp ou par téléphone. Livraison à Bamako.">
<meta name="theme-color" content="#d0406e">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<main class="page-contact">
  <h1 class="titre">Contact</h1>
  <form id="formContact" novalidate>
    <label class="champ"><input name="nom" placeholder=" " autocomplete="name" required><span>Nom</span><em>Ce champ est obligatoire</em></label>
    <label class="champ"><input name="tel" type="tel" inputmode="tel" placeholder=" " autocomplete="tel"><span>Téléphone</span></label>
    <label class="champ"><textarea name="message" placeholder=" " required></textarea><span>Commentaire</span><em>Écrivez votre message</em></label>
    <button class="btn-noir large" type="submit">Envoyer sur WhatsApp</button>
  </form>
  <div class="infos-contact" id="infosContact"></div>
  <h2 class="titre faq-titre" id="questions">Questions Fréquentes&nbsp;!?</h2>
  <div class="faq" id="faq"></div>
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
