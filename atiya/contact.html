<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — ATIYA</title>
<meta name="description" content="Contactez ATIYA sur WhatsApp ou par téléphone. Livraison à Bamako.">
<meta name="theme-color" content="#d4467f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d4467f'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='38' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=Lobster&family=Playfair+Display:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<main class="page-contact">
  <h1 class="titre">Contact</h1>
  <form id="formContact" novalidate>
    <label class="champ"><input name="nom" placeholder=" " autocomplete="name" required><span>Nom</span><em>Ce champ est obligatoire</em></label>
    <label class="champ"><input name="tel" type="tel" inputmode="tel" placeholder=" " autocomplete="tel"><span>Téléphone</span></label>
    <label class="champ"><textarea name="message" placeholder=" " required></textarea><span>Commentaire</span><em>Écrivez votre message</em></label>
    <button class="btn-noir large" type="submit">Envoyer sur WhatsApp</button>
  </form>
  <div class="infos-contact" id="infosContact"></div>
  <h2 class="titre faq-titre">Questions Fréquentes !?</h2>
  <div class="faq" id="faq"></div>
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
